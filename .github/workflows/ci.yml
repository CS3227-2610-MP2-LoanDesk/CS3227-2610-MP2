name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact_suffix: linux
          - os: windows-latest
            label: Windows
            artifact_suffix: windows
          - os: macos-14
            label: macOS Apple Silicon
            artifact_suffix: macos-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build, test and package
        shell: bash
        run: ./gradlew build
      - name: Prepare platform-labelled JAR
        shell: bash
        run: |
          mkdir -p build/artifacts
          cp build/libs/*-all.jar "build/artifacts/loandesk-${{ matrix.artifact_suffix }}.jar"
      - name: Upload the platform JAR
        uses: actions/upload-artifact@v4
        with:
          name: loandesk-jar-${{ matrix.artifact_suffix }}
          path: build/artifacts/loandesk-${{ matrix.artifact_suffix }}.jar
          if-no-files-found: error
      - name: Upload the packaged distribution
        uses: actions/upload-artifact@v4
        with:
          name: loandesk-distribution-${{ matrix.artifact_suffix }}
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download platform JARs
        uses: actions/download-artifact@v4
        with:
          pattern: loandesk-jar-*
          merge-multiple: true
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release-assets/*.jar
          --generate-notes --title "LoanDesk ${{ github.ref_name }}"

  skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # These validate the skill evaluation protocol. They do not invoke an
      # agent and do not test automatic skill selection.
      - name: Check borrower skill contracts
        run: python tools/borrower/test_skill_contracts.py
      - name: Check supervisor skill contracts
        run: python tools/supervisor/test_skill_contracts.py
      - name: Verify the controlled permission/workflow fixture pair
        run: >-
          ./gradlew -p tools/supervisor/skill-evaluations/permission-workflow
          verifyFixtures
